services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voyara
      POSTGRES_PASSWORD: voyara
      POSTGRES_DB: voyara
    ports:
      - "5432:5432"
    volumes:
      - voyara_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyara -d voyara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voyara_pg:
